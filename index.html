<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dokumentasi</title>
    <meta name="description" content="Dokumentasi lengkap" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./favicon/site.webmanifest" />

    <!-- Docsify v5 Core Theme -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css"
    />

    <!-- Docsify v5 Dark Mode Addon (auto follow OS) -->
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Custom Theme Variables & Styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="loading sidebar-chevron-right sidebar-group-box">
    <div id="app"></div>

    <!-- Configuration -->
    <script>
      window.$docsify = {
        name: "Dokumentasi Lengkap",
        repo: "",
        homepage: "home.md",
        loadSidebar: true,
        auto2top: true,
        maxLevel: 4,
        subMaxLevel: 3,

        // Sidebar features
        collapsibleSidebarGroups: true,
        collapseSidebarGroups: true,

        // Search
        search: {
          placeholder: "Cari...",
          noData: "Tidak ada hasil ditemukan",
          depth: 3,
          resultSource: "page",
        },

        // Footer via plugin
        plugins: [
          function (hook) {
            hook.afterEach(function (html) {
              const footer = `
                <footer class="docsify-footer">
                  <p>&copy; ${new Date().getFullYear()} My Documentation</p>
                  <p>Made with ❤️ using <a href="https://docsify.js.org" target="_blank" rel="noopener">Docsify</a></p>
                </footer>
              `;
              return html + footer;
            });
          },
        ],
      };
    </script>

    <!-- Docsify v5 Core -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- Plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/zoom-image.min.js"></script>

    <!-- Custom Foldertree Plugin -->
    <script src="plugins/foldertree.js"></script>

    <!-- Custom Shiki Syntax Highlighting (kompatibel Docsify v5) -->
    <script type="module" src="plugins/shiki.js"></script>
  </body>
</html>
